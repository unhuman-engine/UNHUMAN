name: Build Windows

on:
  push:
    branches: [ main, master ]
    # A version tag (v0.2.0) also publishes the packages as a GitHub Release.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # attaching the packages to a release on a version tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $sdkVersion = "1.4.350.0"
          $installerUrl = "https://vulkan.lunarg.com/sdk/download/$sdkVersion/windows/vulkansdk-windows-X64-$sdkVersion.exe"
          $installerPath = "$env:TEMP\vulkansdk-installer.exe"
          
          Write-Host "Downloading Vulkan SDK $sdkVersion..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          
          Write-Host "Installing Vulkan SDK silently..."
          Start-Process -FilePath $installerPath -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow
          
          $sdkPath = "C:\VulkanSDK\$sdkVersion"
          Write-Host "Setting VULKAN_SDK=$sdkPath"
          echo "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\Bin" >> $env:GITHUB_PATH

      - name: Run Setup Script (download Slang etc.)
        run: python script/Setup.py

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install FreeType
        shell: pwsh
        run: vcpkg install freetype:x64-windows

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVG_PROFILE=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      # The editor bundle and PondDemo exported as a game, as zips (see
      # script/package.py). No GPU here to run the game; the Linux job does.
      - name: Package
        run: python script/package.py --bin bin/Release-windows-x64 --out dist --zip

      - name: List the exported game
        shell: pwsh
        run: Get-ChildItem dist/PondDemo-windows-x64 -File | Format-Table Name, Length

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: UHE-Editor-Windows-x64
          path: dist/UHE-Editor-windows-x64.zip
          retention-days: 30

      - name: Upload exported PondDemo
        uses: actions/upload-artifact@v4
        with:
          name: PondDemo-Windows-x64
          path: dist/PondDemo-windows-x64.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UHE-Editor-windows-x64.zip
            dist/PondDemo-windows-x64.zip
