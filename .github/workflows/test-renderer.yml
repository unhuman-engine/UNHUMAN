name: Test Renderer (ASAN)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      renderdoc_capture:
        description: "Also capture Sandbox frame 30 with RenderDoc and upload the .rdc"
        type: boolean
        default: false

jobs:
  test-asan:
    name: Build & Test (ASAN)
    # LunarG only publishes apt packages up to noble (24.04); ubuntu-latest moves past it.
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libwayland-dev libxkbcommon-dev libfreetype6-dev \
            mesa-vulkan-drivers xvfb

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          source /etc/os-release
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${VERSION_CODENAME}.list http://packages.lunarg.com/vulkan/lunarg-vulkan-${VERSION_CODENAME}.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Run Setup Script (download Slang etc.)
        run: python script/Setup.py

      - name: Patch Vendor CMakeLists (Fix Platform Detection)
        run: |
          cat << 'EOF' > UHE/vendor/imgui/CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          project(ImGui)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(ImGui STATIC imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp imgui_demo.cpp misc/cpp/imgui_stdlib.cpp imgui.h imgui_internal.h imconfig.h imstb_rectpack.h imstb_textedit.h imstb_truetype.h)
          set_target_properties(ImGui PROPERTIES POSITION_INDEPENDENT_CODE ON)
          if(CMAKE_SYSTEM_NAME STREQUAL "Windows")
              target_compile_definitions(ImGui PRIVATE IMGUI_API=__declspec\(dllexport\))
          elseif(UNIX)
              target_compile_definitions(ImGui PRIVATE IMGUI_API=__attribute__\(\(visibility\(\"default\"\)\)\))
          endif()
          target_include_directories(ImGui PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
          if(CMAKE_SYSTEM_NAME STREQUAL "Windows" AND CMAKE_CXX_COMPILER_ID MATCHES "MSVC")
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Release>:/MT>)
              target_compile_options(ImGui PRIVATE /utf-8)
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Debug>:/Zi>)
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Release>:/O2>)
          endif()
          set_target_properties(ImGui PROPERTIES RUNTIME_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA ARCHIVE_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA LIBRARY_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA)
          EOF
          sed -i 's/if(WIN32)/if(CMAKE_SYSTEM_NAME STREQUAL "Windows")/g' UHE/vendor/imGuizmo/CMakeLists.txt
          sed -i 's/if(MSVC)/if(CMAKE_SYSTEM_NAME STREQUAL "Windows" AND CMAKE_CXX_COMPILER_ID MATCHES "MSVC")/g' UHE/vendor/imGuizmo/CMakeLists.txt

      - name: Configure CMake (ASAN Enabled)
        run: >
          cmake --preset sanitizer
          -DUHE_SANITIZER=address
          -DVG_PROFILE=OFF

      - name: Build
        run: cmake --build --preset sanitizer --parallel

      - name: Run Tests (Headless + Lavapipe)
        run: |
          OUT_DIR="bin/Debug-linux-x64-address"
          test -d "$OUT_DIR" || { echo "Output dir '$OUT_DIR' missing"; exit 1; }
          cd "$OUT_DIR"
          # xvfb-run sets up a virtual X display
          # VK_ICD_FILENAMES forces Vulkan to use the Lavapipe software driver
          # timeout 10s kills the engine with exit 124; treat that as pass.
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          # A validation error is a defect, not a note to read past: the engine
          # stops on the first one with a non-zero exit.
          export UHE_VALIDATION_FATAL=1
          set +e
          timeout 10s xvfb-run --auto-servernum ./UHE_EDITOR > editor.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            # Belt and braces: catches a build without the gate, or a message
            # that reached the log before the process stopped.
            if grep -qE '\[error\].*Validation layer|UHE_VALIDATION_FATAL' editor.log; then
              echo "Editor ran, but Vulkan validation reported an error:"
              grep -m3 -E '\[error\].*Validation layer|UHE_VALIDATION_FATAL' editor.log || true
              exit 1
            fi
            # And this catches the opposite: a run with no layers to report
            # with, which would otherwise pass by saying nothing.
            if ! grep -qF "[VALIDATION] enabled" editor.log; then
              echo "Editor ran, but never enabled validation layers: the run proves nothing."
              exit 1
            fi
            echo "Engine survived for 10 seconds. Test passed!"
            exit 0
          else
            echo "Engine crashed or failed with exit code $rc!"
            tail -n 50 editor.log || true
            exit 1
          fi

      # Visual regression: render a fixed frame of the Sandbox on lavapipe and
      # compare it with the reference in tests/golden/. The smoke runs above
      # prove the engine renders *something* without a validation error; this
      # proves it renders the *right* thing. UHE_FIXED_TIMESTEP makes frame N
      # the same scene on every run, and UHE_CAPTURE_FRAME reads that frame back
      # from the swapchain, writes it as PNG and exits (UHE/src/UHE/Core/CaptureSettings.h).
      - name: Golden image (Sandbox, lavapipe)
        shell: bash
        run: |
          OUT_DIR="$PWD/bin/Debug-linux-x64-address"
          GOLDEN="$PWD/tests/golden/sandbox_box.png"
          RESULTS="$PWD/golden-results"
          mkdir -p "$RESULTS"

          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          [ -n "$VK_ICD_FILENAMES" ] || { echo "Lavapipe ICD not found"; exit 1; }
          export UHE_VALIDATION_FATAL=1
          export UHE_FIXED_TIMESTEP=0.016666667
          export UHE_CAPTURE_FRAME=30
          export UHE_CAPTURE_PATH="$RESULTS/actual.png"
          # The run ends with a normal exit, which is where LeakSanitizer would
          # report the vendors' process-lifetime allocations; leaks are the
          # sanitizer jobs' business, pixels are this step's.
          export ASAN_OPTIONS="detect_leaks=0"

          # The window is 1920x1080 and the screen must hold it, or the
          # swapchain (and the golden image) would take the screen's size.
          Xvfb :98 -screen 0 1920x1080x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          export DISPLAY=:98
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X98 ] && break; sleep 0.2; done

          set +e
          (cd "$OUT_DIR" && timeout 300s ./Sandbox > "$RESULTS/sandbox.log" 2>&1)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Sandbox exited with $rc before writing its frame:"
            tail -n 60 "$RESULTS/sandbox.log"
            exit 1
          fi
          # A capture from a run without layers would be compared, but nothing
          # would have checked the frame that produced it.
          grep -qF "[VALIDATION] enabled" "$RESULTS/sandbox.log" || { echo "Validation layers were not enabled"; exit 1; }
          grep -F "[CAPTURE]" "$RESULTS/sandbox.log"
          test -s "$RESULTS/actual.png" || { echo "No frame was captured"; exit 1; }

          if [ ! -f "$GOLDEN" ]; then
            echo "No reference at tests/golden/sandbox_box.png."
            echo "Download the 'golden-image' artifact, check actual.png by eye and commit it there."
            exit 1
          fi
          "$OUT_DIR/uhe_imgdiff" "$GOLDEN" "$RESULTS/actual.png" --diff "$RESULTS/diff.png"

      # On a mismatch: actual.png is what this commit renders, diff.png marks
      # the differing pixels red. If the change is intended, actual.png is the
      # new reference.
      - name: Upload golden-image results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image
          path: golden-results/
          retention-days: 14
          if-no-files-found: ignore

      # Optional, manual runs only: the same deterministic frame the golden
      # image checks, as a RenderDoc capture to open with qrenderdoc. Every
      # frame graph pass is a labelled region and resources carry their names
      # (VK_EXT_debug_utils). Never gates the job: RenderDoc inside an ASan
      # process is not a supported combination.
      - name: RenderDoc capture (Sandbox frame 30)
        if: github.event_name == 'workflow_dispatch' && inputs.renderdoc_capture
        continue-on-error: true
        shell: bash
        run: |
          OUT_DIR="$PWD/bin/Debug-linux-x64-address"
          RESULTS="$PWD/renderdoc-capture"
          mkdir -p "$RESULTS"
          RD_VERSION=1.46
          if curl -fsSL "https://renderdoc.org/stable/${RD_VERSION}/renderdoc_${RD_VERSION}.tar.gz" -o /tmp/renderdoc.tar.gz; then
            tar -xzf /tmp/renderdoc.tar.gz -C /tmp
          else
            sudo apt-get install -y renderdoc
          fi
          RD_LIB=$(find /tmp/renderdoc_* /usr/lib -name librenderdoc.so 2>/dev/null | head -n 1)
          [ -n "$RD_LIB" ] || { echo "librenderdoc.so not found"; exit 1; }
          export LD_LIBRARY_PATH="$(dirname "$RD_LIB"):${LD_LIBRARY_PATH:-}"
          # RenderDoc captures Vulkan through its implicit layer. A system
          # install registers it; the tarball only ships the manifest, so point
          # the loader at it and switch the layer on, or the API attaches and
          # every capture silently records nothing.
          RD_LAYER=$(find /tmp/renderdoc_* /usr/share/vulkan /etc/vulkan -name 'renderdoc_capture.json' 2>/dev/null | head -n 1)
          if [ -n "$RD_LAYER" ]; then
            export VK_ADD_LAYER_PATH="$(dirname "$RD_LAYER")"
            echo "RenderDoc layer manifest: $RD_LAYER"
            cat "$RD_LAYER"
          fi
          export ENABLE_VULKAN_RENDERDOC_CAPTURE=1

          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export UHE_FIXED_TIMESTEP=0.016666667
          # The run ends at frame 120: a capture on lavapipe under ASan takes a
          # while to write, and frame 40 ended the process before it existed.
          export UHE_CAPTURE_FRAME=120
          export UHE_CAPTURE_PATH="$RESULTS/frame120.png"
          export ASAN_OPTIONS="detect_leaks=0"
          Xvfb :97 -screen 0 1920x1080x24 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          export DISPLAY=:97
          for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X97 ] && break; sleep 0.2; done

          (cd "$OUT_DIR" && timeout 300s ./Sandbox -renderdoc -renderdoc-frame 30 \
            -renderdoc-out "$RESULTS/sandbox" > "$RESULTS/sandbox.log" 2>&1) || true
          grep -E "RenderDoc" "$RESULTS/sandbox.log" || true
          # RenderDoc's own log says why a capture failed.
          cp /tmp/RenderDoc/*.log "$RESULTS/" 2>/dev/null || true
          ls "$RESULTS"/*.rdc

      - name: Upload RenderDoc capture
        if: github.event_name == 'workflow_dispatch' && inputs.renderdoc_capture
        uses: actions/upload-artifact@v4
        with:
          name: renderdoc-capture
          path: renderdoc-capture/
          retention-days: 7
          if-no-files-found: ignore
