name: Build Linux

on:
  push:
    branches: [ main, master ]
    # A version tag (v0.2.0) also publishes the packages as a GitHub Release.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-linux:
    # LunarG only publishes apt packages up to noble (24.04); ubuntu-latest moves past it.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attaching the packages to a release on a version tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libwayland-dev libxkbcommon-dev libfreetype6-dev \
            mesa-vulkan-drivers xvfb

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          source /etc/os-release
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${VERSION_CODENAME}.list http://packages.lunarg.com/vulkan/lunarg-vulkan-${VERSION_CODENAME}.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Run Setup Script (download Slang etc.)
        run: python script/Setup.py

      - name: Patch Vendor CMakeLists (Fix Platform Detection)
        run: |
          cat << 'EOF' > UHE/vendor/imgui/CMakeLists.txt
          cmake_minimum_required(VERSION 3.16)
          project(ImGui)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_library(ImGui STATIC imgui.cpp imgui_draw.cpp imgui_tables.cpp imgui_widgets.cpp imgui_demo.cpp misc/cpp/imgui_stdlib.cpp imgui.h imgui_internal.h imconfig.h imstb_rectpack.h imstb_textedit.h imstb_truetype.h)
          set_target_properties(ImGui PROPERTIES POSITION_INDEPENDENT_CODE ON)
          if(CMAKE_SYSTEM_NAME STREQUAL "Windows")
              target_compile_definitions(ImGui PRIVATE IMGUI_API=__declspec\(dllexport\))
          elseif(UNIX)
              target_compile_definitions(ImGui PRIVATE IMGUI_API=__attribute__\(\(visibility\(\"default\"\)\)\))
          endif()
          target_include_directories(ImGui PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
          if(CMAKE_SYSTEM_NAME STREQUAL "Windows" AND CMAKE_CXX_COMPILER_ID MATCHES "MSVC")
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Release>:/MT>)
              target_compile_options(ImGui PRIVATE /utf-8)
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Debug>:/Zi>)
              target_compile_options(ImGui PRIVATE $<$<CONFIG:Release>:/O2>)
          endif()
          set_target_properties(ImGui PROPERTIES RUNTIME_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA ARCHIVE_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA LIBRARY_OUTPUT_DIRECTORY ${CMAKE_SOURCE_DIR}/bin/${OUTPUT_DIR}/VEGA)
          EOF
          sed -i 's/if(WIN32)/if(CMAKE_SYSTEM_NAME STREQUAL "Windows")/g' UHE/vendor/imGuizmo/CMakeLists.txt
          sed -i 's/if(MSVC)/if(CMAKE_SYSTEM_NAME STREQUAL "Windows" AND CMAKE_CXX_COMPILER_ID MATCHES "MSVC")/g' UHE/vendor/imGuizmo/CMakeLists.txt

      - name: Configure CMake
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVG_PROFILE=OFF

      - name: Build
        run: cmake --build build --parallel

      # CPU-only unit tests (no GPU, no display). Building them was never the
      # problem: nothing ran them, so a harness that stopped linking or a
      # check that started failing stayed green. See AGENTS.md "Tests and CI".
      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure

      # The editor bundle (editor, runtime, tools, assets, example projects)
      # and PondDemo exported as a game, each as a folder and a .zip. The zips
      # are what is uploaded: they keep the executables' permissions.
      - name: Package
        run: python script/package.py --bin bin/Release-linux-x64 --out dist --zip

      # The exported game has to run on its own: copied out of the source
      # tree, on lavapipe, it must reach its scene and draw frames without an
      # error and without compiling a shader (it ships none to compile).
      - name: Exported game runs outside the repo (lavapipe)
        run: |
          GAME="$RUNNER_TEMP/game"
          unzip -q dist/PondDemo-linux-x64.zip -d "$GAME"
          cd "$GAME/PondDemo-linux-x64"
          echo "Libraries the game needs from the system:"
          ldd ./PondDemo | grep -v "$PWD" || true
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          export UHE_FIXED_TIMESTEP=0.016666667
          export UHE_CAPTURE_FRAME=5
          export UHE_CAPTURE_PATH="$GITHUB_WORKSPACE/dist/PondDemo-frame.png"
          set +e
          timeout 300s xvfb-run --auto-servernum -s "-screen 0 1280x720x24" \
            ./PondDemo -width 960 -height 540 > game.log 2>&1
          rc=$?
          set -e
          cp game.log "$GITHUB_WORKSPACE/dist/PondDemo-run.log"
          if [ "$rc" -ne 0 ]; then echo "The game exited with $rc:"; tail -n 60 game.log; exit 1; fi
          grep -F "Runtime: playing" game.log || { echo "The game never reached its scene"; tail -n 60 game.log; exit 1; }
          if grep -E "\[error\]|: compiling" game.log; then echo "The game logged errors or compiled shaders"; exit 1; fi
          test -s "$UHE_CAPTURE_PATH" || { echo "No frame was captured"; exit 1; }

      - name: Upload editor
        uses: actions/upload-artifact@v4
        with:
          name: UHE-Editor-Linux-x64
          path: dist/UHE-Editor-linux-x64.zip
          retention-days: 30

      - name: Upload exported PondDemo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PondDemo-Linux-x64
          path: |
            dist/PondDemo-linux-x64.zip
            dist/PondDemo-frame.png
            dist/PondDemo-run.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UHE-Editor-linux-x64.zip
            dist/PondDemo-linux-x64.zip
